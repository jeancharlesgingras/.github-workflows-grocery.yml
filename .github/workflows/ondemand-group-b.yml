name: OnDemand-Group-B

on:
  schedule:
    - cron: '10 8 * * *'
  workflow_dispatch:

concurrency:
  group: ondemand
  cancel-in-progress: false

jobs:
  run_cat_group_b:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - name: Run 15 categories (20 min spacing)
        shell: bash
        run: |
          set -uo pipefail

          declare -a cats=(
            "Home Décor" "Storage & Organization"
            "Patio Furniture & Accessories" "Outdoor Décor"
            "Garden Structures & Germination Equipment" "Outdoor Cooking"
            "Sports Fan Shop" "Diet & Nutrition Products"
            "Snacks & Sweets" "Cooking & Baking Supplies"
            "Health Care Products" "Tableware" "Kitchen Cookware"
            "Baby" "Lighting & Ceiling Fans"
          )

          failures=0
          echo "Total categories: ${#cats[@]}"

          for i in "${!cats[@]}"; do
            cat="${cats[$i]}"
            slug=$(python3 -c 'import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1], safe=""))' "$cat")
            resp_file="/tmp/resp_${i}.txt"

            echo "--------------------------------------------------"
            echo "[$(date -u)] ($((i+1))/${#cats[@]}) calling: $cat"
            echo "URL: ${{ secrets.OND_WEBAPP }}?secret=***&task=$slug"

            http_code=$(
              curl -sS -L --max-redirs 5 --fail-with-body \
                -o "$resp_file" -w "%{http_code}" \
                "${{ secrets.OND_WEBAPP }}?secret=${{ secrets.OND_SECRET }}&task=$slug" \
              || echo "000"
            )

            echo "HTTP: $http_code"
            echo "Response (last 50 lines):"
            tail -n 50 "$resp_file" || true

            if [[ "$http_code" != "200" ]]; then
              echo "::warning::HTTP $http_code for '$cat'"
              failures=$((failures+1))
            else
              if grep -qiE 'unknown task|unauthorized|missing task param|error' "$resp_file"; then
                echo "::warning::Body indicates failure for '$cat'"
                failures=$((failures+1))
              fi
            fi

            if [[ $i -lt $((${#cats[@]}-1)) ]]; then
              sleep $((20*60))
            fi
          done

          echo "--------------------------------------------------"
          echo "Finished. failures=$failures"
          [[ $failures -eq 0 ]] || exit 1
